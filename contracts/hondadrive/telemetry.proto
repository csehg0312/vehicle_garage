syntax = "proto3";

package hondadrive.telemetry.v1;

enum VehicleState {
  VEHICLE_STATE_UNSPECIFIED = 0;
  UNKNOWN = 1;
  IDLE = 2;
  ACCELERATION = 3;
  CRUISING = 4;
  DECELERATION = 5;
  COASTING_NEUTRAL = 6;
  HIGH_LOAD = 7;
}

enum TelemetryEventType {
  TELEMETRY_EVENT_UNSPECIFIED = 0;
  STATE_TRANSITION = 1;
  VALIDATION = 2;
  ANOMALY = 3;
  SHIFT_CANDIDATE = 4;
}

enum ShiftCandidateDirection {
  SHIFT_CANDIDATE_DIRECTION_UNSPECIFIED = 0;
  UP = 1;
  DOWN = 2;
}

message VehicleRef {
  string vehicle_id = 1;
  string profile_id = 2;
}

message GpsTelemetry {
  sint32 latitude_e7 = 1;
  sint32 longitude_e7 = 2;
  uint32 speed_kph_x10 = 3;
  uint32 heading_degrees_x10 = 4;
  uint32 accuracy_m_x100 = 5;
}

message ObdTelemetry {
  uint32 rpm_x10 = 1;
  uint32 speed_kph_x10 = 2;
  sint32 coolant_celsius_x10 = 3;
  uint32 engine_load_percent_x10 = 4;
  uint32 map_kpa_x10 = 5;
  sint32 intake_air_celsius_x10 = 6;
  uint32 throttle_percent_x10 = 7;
  sint32 short_fuel_trim_percent_x10 = 8;
  sint32 long_fuel_trim_percent_x10 = 9;
  uint32 maf_g_per_s_x100 = 10;
  uint32 fuel_level_percent_x10 = 11;
  uint32 control_module_voltage_x100 = 12;
  sint32 timing_advance_degrees_x10 = 13;
  uint32 fuel_pressure_kpa_x10 = 14;
  uint32 runtime_since_start_seconds = 15;
  uint32 barometric_pressure_kpa_x10 = 16;
  sint32 ambient_air_celsius_x10 = 17;
}

message DerivedTelemetry {
  sint32 total_fuel_trim_percent_x10 = 1;
  uint32 estimated_air_mass_g_per_s_x100 = 2;
  uint32 estimated_fuel_rate_lph_x100 = 3;
  uint32 estimated_fuel_economy_l_per_100km_x100 = 4;
  uint32 estimated_power_kw_x100 = 5;
  uint32 estimated_torque_nm_x100 = 6;
}

message StateEstimate {
  uint64 timestamp_ms = 1;
  VehicleState state = 2;
  uint32 confidence_x1000 = 3;
}

message ShiftCandidate {
  ShiftCandidateDirection direction = 1;
  uint32 confidence_x1000 = 2;
}

message TelemetryEvent {
  uint64 sequence = 1;
  uint64 timestamp_ms = 2;
  TelemetryEventType type = 3;
  VehicleState state_from = 4;
  VehicleState state_to = 5;
  uint32 confidence_x1000 = 6;
  ShiftCandidate shift_candidate = 7;
  string message = 8;
}

message TelemetrySample {
  uint64 sequence = 1;
  uint64 timestamp_ms = 2;
  GpsTelemetry gps = 3;
  ObdTelemetry obd = 4;
  DerivedTelemetry derived = 5;
}

message TelemetryFrame {
  string trip_id = 1;
  VehicleRef vehicle = 2;
  uint64 first_sequence = 3;
  uint64 last_sequence = 4;
  uint64 sent_at_ms = 5;
  repeated TelemetrySample samples = 6;
  repeated StateEstimate state_estimates = 7;
  repeated TelemetryEvent events = 8;
  uint32 schema_version = 9;
}
