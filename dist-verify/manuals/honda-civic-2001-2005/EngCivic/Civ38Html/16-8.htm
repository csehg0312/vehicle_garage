<P><ol class=para1 start=8.><li>Remove the stop ring from the driveshaft.
</li></ol>
<p class=imgcenter><img src="16-8a38.gif"></P>

<P><ol class=para1 start=9.><li>Wrap the splines on the driveshaft with vinyl tape (A) to prevent damage to the boot.
</li></ol>
<p class=imgcenter><img src="16-8b38.gif"></P>

<P><ol class=para1 start=10.><li>Remove the outboard boot. Take care not to damage the boot.
</li></ol>
<ol class=para1 start=11.><li>Remove the vinyl tape.
</li></ol>
