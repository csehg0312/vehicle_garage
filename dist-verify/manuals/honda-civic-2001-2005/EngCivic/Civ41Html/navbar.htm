<script id="ClientEventHandlersJS" language="javascript">

var cont = 0
function far_onclick(){
cont=0
var ln1 = window.parent.frames('content').document.links.length - 2
document.images[3].src="b_prevpage.png"
if(window.parent.frames("content").document.location.href == window.parent.frames("content").document.links[ln1]) {
document.images[4].src="b_nextpage_x.png" }
else{
document.images[4].src="b_nextpage.png"
window.parent.frames('content').location = window.parent.frames('content').document.links[ln1]
}
}


function EX1_onclick(){

parent.window.close()
}





function bac_onclick(){
cont=0
var ln0 = window.parent.frames('content').document.links.length - 3
document.images[4].src="b_nextpage.png"
if(window.parent.frames("content").document.location.href == window.parent.frames("content").document.links[ln0]) {
document.images[3].src="b_prevpage_x.png" }
else{
document.images[3].src="b_prevpage.png"
window.parent.frames('content').location = window.parent.frames('content').document.links[ln0]
}
}
function home1_onclick(){
cont=0
url = location.href
var lastSlash = url.lastIndexOf("/")

var urlstr = url.substring(0, lastSlash)
lastSlash = urlstr.lastIndexOf("/")
var urlstr2 = urlstr.substring(0, lastSlash + 1)
var urlstr1 = urlstr2 + "body.htm"
var ln3 = window.parent.frames('content').document.links.length - 1
document.images[4].src="b_nextpage.png"
document.images[3].src="b_prevpage.png"
//window.parent.frames('content').location = window.parent.frames("content").document.links[ln3]
window.parent.location = urlstr1
}
function hom_onclick(){
cont=0
url = location.href

var lastSlash = url.lastIndexOf("/")
var urlstr = url.substring(0, lastSlash +1)
var urlstr1 = urlstr + "helpset.htm"
var ln3 = window.parent.frames('content').document.links.length - 1

document.images[4].src="b_nextpage.png"
document.images[3].src="b_prevpage.png"
window.parent.frames('content').location = window.parent.frames("content").document.links[ln3]
//window.parent.location = urlstr1
}
function prn_onclick(){
chkzoom()
self.parent.frames[1].focus()
self.parent.frames[1].print()
}

function chkzoom(){

if (cont == 1) {
cont = 0
window.parent.frames("content").document.location = window.parent.frames("content").document.location.href
}


}
function his_onclick(){
self.parent.frames[1].history.back()
}
function z1_onclick(){

if (cont == 0 ) {
cont=1
for (var i = 0; i <= window.parent.frames("content").document.images.length; i++){
window.parent.frames("content").document.images[i].height = window.parent.frames("content").document.images[i].height * 1.3;
window.parent.frames("content").document.images[i].width = window.parent.frames("content").document.images[i].width * 1.3;}
}
else
{
cont = 0
window.parent.frames("content").document.location = window.parent.frames("content").document.location.href
}
}
