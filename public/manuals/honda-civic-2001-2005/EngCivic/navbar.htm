function zoom(){
	UpdateZoom=parent.frames('content').location.href.toLowerCase();
	if (LastZoom!=UpdateZoom){
		x=0;
	}
	if (x==0){
		ReturnWidth=new Array();
		ReturnHeight=new Array();

		for (i=0; i<window.parent.frames("content").document.images.length; i++){


			ReturnWidth[i]=window.parent.frames("content").document.images[i].width;
			ReturnHeight[i]=window.parent.frames("content").document.images[i].height;
			LastZoom=parent.frames('content').location.href.toLowerCase();

			window.parent.frames("content").document.images[i].height = window.parent.frames("content").document.images[i].height * 1.2;
			window.parent.frames("content").document.images[i].width = window.parent.frames("content").document.images[i].width * 1.2;	
		}
	}
	else if (x==1){
		for (i=0; i<window.parent.frames("content").document.images.length; i++){
			window.parent.frames("content").document.images[i].height = ReturnHeight[i];
			window.parent.frames("content").document.images[i].width = ReturnWidth[i];
		}
	}

//tells browser if zoom was clicked.
	if (x==0){
		x=1;
	}
	else{
		x=0;
	}
}
